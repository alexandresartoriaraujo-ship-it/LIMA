<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parágrafos</title>
</head>
<body>
    
<!-- Tag de parágrafo -->
<p>Isso é um parágrafo</p>

<!-- strong: Importância -->
<p>Conheça o <strong>iPhone 18</strong></p>

<!-- em: Ênfase -->
<p>Esse é um <em>texto em itálico</em></p>

<!-- u: Sublinhado -->
<p>Exemplo de <u>texto sublinhado</u></p>

<!-- small: Pequeno -->
 <p>Esse é um exemplo de <small>texto Pequeno</small></p>


</body>
</html>
