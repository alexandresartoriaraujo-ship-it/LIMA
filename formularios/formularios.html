<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>

    <form><!-- Estrutura do formulario -->

        <label for="nome">Nome: </label>
        <input type="text" name="nome" placeholder="Informe seu nome" required>

        <label for="email">E-mail: </label>
        <input type="email" name="email" placeholder="Informe seu e-mail" required> 

        <label for="password">Senha: </label>
        <input type="password" name="password" required> 

        <label for="color">Cores: </label>
        <input type="color" name="color" required>

        <label for="checkbox">Checkbox: </label>
        <input type="checkbox" name ="checkbox" required>

        <label for="Data">Data: </label>
        <input for="Date" name="Date" placeholder="Informe sua senha" required>

        <label for="idade">Idade: </label>
        <input type="number" name="idade" placeholder="Informe sua idade" required>

        <button type="submit">Enviar</button>
    </form>
    
</body>
</html>
