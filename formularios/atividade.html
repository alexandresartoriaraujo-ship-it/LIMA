<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularíos</title>
</head>
<body>

    <form>
        <label for="nome">Nome: </label>
        <input type="text" name="nome" placeholder="Informe seu nome" required>
           
        <br>

        <label for="sobrenome">Sobrenome: </label>
        <input type="text" name="sobrenome" placeholder="Informe seu sobrenome" required>
           
        <br>

        <label for="Idade">Idade: </label>
        <input type="number" name="Idade" placeholder="Informe sua Idade" required>

        <br>

        <label for="email">E-mail: </label>
        <input type="email" name="email" placeholder="Informe seu e-mail" required>

        <br>

        <label for="Senha">Senha: </label>
        <input type="password" name="Senha" placeholder="Informe sua senha" required>

        <br>

        <button type="submit">Enviar</button>




    </form>
    
</body>
</html>
